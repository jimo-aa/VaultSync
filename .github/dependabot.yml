# Dependabot（P6-7 供应链治理，docs/v2.0/09 §三 P6-7）
# Cargo 与 GitHub Actions 周检；Flutter（pub）暂无原生支持，由 CI 的
# flutter pub outdated 人工复核（后续任务可加）。
version: 2
updates:
  - package-ecosystem: cargo
    directory: /native
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      rust-minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: pub
    directory: /app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
