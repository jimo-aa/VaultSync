# 保险箱容器与索引，依赖 crypto + store + audit（docs/v2.0/02 §三）。
[package]
name = "vault-vault"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
vault-crypto = { path = "../vault-crypto" }
vault-store = { path = "../vault-store" }
vault-audit = { path = "../vault-audit" }
fastcdc = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1.8"

[dev-dependencies]
tempfile = "3"
