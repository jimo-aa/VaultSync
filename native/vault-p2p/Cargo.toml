# P2P 网络与同步：Noise（snow）+ 自研轻量帧协议，未引入 libp2p（设计偏移见 LOG 2026-09-18 与 docs/v1.0/README §四 归档批注）。
[package]
name = "vault-p2p"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
vault-crypto = { path = "../vault-crypto" }
vault-audit = { path = "../vault-audit" }
vault-net = { version = "0.1.0", path = "../vault-net" }
snow = "0.10.0"
ed25519-dalek = "3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
vault-vault = { version = "0.1.0", path = "../vault-vault" }
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
# P8-9 阅后即焚：票据秘密仅内存持有，Drop 即擦除
zeroize = "1.8"

[dev-dependencies]
tempfile = "3.27.0"
